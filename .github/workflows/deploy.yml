name: CI/CD Pipeline - FreelancerHub Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Playwright E2E Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar compilacion de Vite
        run: pnpm build

      - name: Instalar navegador Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar Suite E2E de Playwright (Ciclo de Negocio y Chat)
        run: pnpm exec playwright test e2e/core-business-flow.spec.ts

      - name: Subir artefactos y reporte de Playwright si ocurre fallo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Despliegue Frontend a Produccion (Fedora Server)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Instalar Cloudflared para el tunel
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Ejecutar script en Fedora por SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/github_key
          chmod 600 ~/.ssh/github_key
          
          cat << SSH_EOF > ~/.ssh/config
          Host servidor_secreto
            HostName $HOST
            User $USER
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            ServerAliveInterval 15
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 60
          SSH_EOF
          
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=10 -i ~/.ssh/github_key servidor_secreto "cd ~/freelancer_hub_frontend && ./deploy.sh"
