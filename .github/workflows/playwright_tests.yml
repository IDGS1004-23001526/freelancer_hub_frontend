name: Playwright E2E Scheduled Tests

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
      - RV
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  playwright-e2e:
    name: Playwright Core Business & Chat E2E
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar compilacion de Vite
        run: pnpm build

      - name: Instalar navegador Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar Suite E2E de Playwright (Ciclo de Negocio y Chat)
        run: pnpm exec playwright test e2e/core-business-flow.spec.ts

      - name: Subir reporte de Playwright si ocurre fallo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
